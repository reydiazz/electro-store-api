services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: electro_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "DevOnly#SQL26!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "DevOnly#SQL26!" -Q "SELECT 1" -No
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sqlserver_data: